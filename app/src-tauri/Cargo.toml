[package]
name = "quack-presence-tray"
version = "1.1.2"
description = "Quack Presence: o ícone na bandeja e a janela de configurações"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# custom-protocol direto: o build é `cargo build --release`, sem o CLI do Tauri que o ligaria,
# e sem ele o exe procuraria um servidor de desenvolvimento em vez da pasta ui embutida.
tauri = { version = "2.12", features = ["tray-icon", "image-png", "custom-protocol"] }
serde_json = "1"
# A atualização pelo GitHub (setup.rs, main.rs) e a pasta escolhida no instalador
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# A pasta da última instalação, que o NSIS grava no registro
winreg = "0.55"

# Dev builds (cargo build, tauri dev, cargo test): line numbers only for this crate, so panics
# and backtraces still name file:line, and no debug info for dependencies. Writing and linking
# full debug info was half of every rebuild: Quackify's one-line rebuild went from 16.9 s to
# 8.8 s and its clean build from 87 s to 59 s (measured 08/11/26). Release has its own settings below.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# No LTO and 16 codegen units (Ender's call, 08/11/26): with lto = true and codegen-units = 1
# every release re-optimised the whole program, 188 s after a one-line change in Quackify; now
# 29 s. The exe is about 12% bigger, the installer about 2%.
[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
strip = true
