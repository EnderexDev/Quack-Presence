<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Quack Presence</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="tray.js"></script>
</head>
<body class="traybody">
  <div class="tray chunk" id="tray">
    <div class="trayhead brand">
      <span class="mark"></span>
      <div class="who"><span class="word">Quack Presence</span><span id="app"></span></div>
    </div>
    <div class="state chunk"><span class="dot" id="dot"></span><span class="grow" id="estado">Carregando...</span><button class="tog" id="ativo" role="switch" title="Ligar ou desligar o card no Discord"></button></div>
    <div id="card"></div>
    <div id="modes"></div>
    <div class="trayfoot">
      <div class="row">
        <button class="btn yellow chunk-bright press" id="settings">Configurações</button>
        <button class="btn dark chunk press" id="quit">Sair</button>
      </div>
      <div class="row">
        <button class="btn dark chunk press" id="reconnect">Reconectar</button>
        <button class="btn dark chunk press file" id="config">config.json</button>
        <button class="btn dark chunk press file" id="log">log</button>
      </div>
    </div>
  </div>
</body>
</html>
